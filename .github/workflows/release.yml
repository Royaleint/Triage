name: Package and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Leave empty to use the current ref.'
        required: false
        type: string
      force:
        description: 'Bypass the newest-tag guard (publish this tag even if a newer tag exists). Use only for a deliberate re-publish.'
        required: false
        type: boolean
        default: false

# Serialize releases: a bulk tag push fires this workflow once per tag ref, so
# two runs can be in flight at once. Without serialization they race to be the
# last CurseForge upload — and the loser's version is what players get. One
# release publishes at a time; never cancel an upload that is already running.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A typo'd or deleted tag on a non-force dispatch doesn't fail loudly —
      # it just isn't the newest tag, so the guard below sets publish=false
      # and the run goes green having released nothing. Fail immediately
      # instead, before the guard's softer "not the newest tag" logic can
      # mask a tag that does not exist at all. The checkout above already
      # ran with fetch-depth: 0, so every tag is available locally — no API
      # call needed. (TRI-049)
      - name: Verify the dispatched tag exists
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Dispatched tag does not exist in this repository — nothing to release."
            echo "Tag: $TAG"
            exit 1
          fi
          echo "Dispatched tag $TAG resolves."

      # Guard against a stale tag re-triggering the uploader. A bulk tag push
      # (e.g. `git push --tags`, or re-pushing previously-deleted tags) fires
      # this workflow once per tag ref — including OLD versions. Whichever run
      # finishes last becomes the newest file on CurseForge/Wago, so an old tag
      # can silently overwrite a newer release (a sibling addon hit exactly this
      # on 2026-06-01). Only the highest version tag in the repo is allowed to
      # publish. See the "never git push --tags" rule in CLAUDE.md / AGENTS.md.
      # versionsort.suffix makes "vX.Y.Z-rc1" sort BEFORE "vX.Y.Z" so a final
      # release is never blocked by its own prerelease tag.
      - name: Guard — only the newest tag may publish
        id: guard
        env:
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          # Highest version = first line of the version-sorted tag list. Read
          # into a var and slice the first line rather than piping to `head`,
          # so an early-closed pipe can't trip `set -o pipefail` (no SIGPIPE).
          ALL_TAGS=$(git -c versionsort.suffix=-alpha \
                         -c versionsort.suffix=-beta \
                         -c versionsort.suffix=-rc \
                         tag --sort=-v:refname --list 'v*')
          NEWEST="${ALL_TAGS%%$'\n'*}"
          echo "Triggering tag:     $TAG"
          echo "Newest tag in repo: $NEWEST"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "$NEWEST" ] || [ "$FORCE" = "true" ]; then
            if [ "$TAG" != "$NEWEST" ]; then
              echo "::warning::Publishing $TAG via force override even though $NEWEST is newer."
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TAG is not the newest tag ($NEWEST); skipping packaging and CurseForge/Wago upload to avoid publishing an older build over a newer one. Re-run from the Actions tab with force=true if this is a deliberate re-publish."
          fi

      # A manual workflow_dispatch run builds whatever branch/ref it was
      # launched from — the checkout above never looks at the `tag` input.
      # The guard and changelog-extraction steps validate against that input,
      # so without this step a dispatch "for v1.0.x" from a branch with newer
      # commits would silently ship the wrong tree under v1.0.x's release
      # notes.
      #
      # Only the release PAYLOAD (everything the packager actually zips) is
      # swapped to the tag's content. `.github` (this workflow plus the
      # verification scripts it runs later) and `.pkgmeta` (the packager's
      # own config) stay on the dispatch ref, so every later step keeps
      # running today's logic against a config that matches it — see the
      # TRI-049 cycle 2 commit message for the rejected alternatives and why
      # this checkout-then-restore approach is the one that ships correctly.
      # Only runs for a manual dispatch that named a tag; a tag push already
      # has that tag checked out, and a tagless dispatch releases whatever
      # ref was checked out above. (TRI-049)
      - name: Checkout release payload from the named tag
        if: steps.guard.outputs.publish == 'true' && inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          DISPATCH_REF="$(git rev-parse HEAD)"
          echo "Swapping release payload to refs/tags/$TAG (dispatch ref: $DISPATCH_REF)"
          git checkout --detach "refs/tags/$TAG"
          git checkout "$DISPATCH_REF" -- .github .pkgmeta

      - name: Extract current version changelog
        if: steps.guard.outputs.publish == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Determine the tag to extract notes for. For tag-push triggers,
          # github.ref_name is the tag (e.g. v1.0.0). For workflow_dispatch,
          # prefer the manual input, fall back to github.ref_name.
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          echo "Extracting release notes for tag: $TAG"

          # Extract the section matching the tag's heading.
          # CHANGELOG headings look like: `## v1.0.0 — ERF Reforged`
          # Match `## $TAG` at start of line, optionally followed by space+title.
          # Stop at the next `## v` heading (next version section).
          awk -v tag="$TAG" \
            'BEGIN{re="^## "tag"($| )"} \
             $0 ~ re {found=1; print; next} \
             /^## v/{if(found) exit} \
             found' CHANGELOG.md > RELEASE_NOTES.md

          # Fail loudly if no matching section was found — pushing a tag
          # without a corresponding CHANGELOG entry is a release-process bug
          # that should block the release rather than silently extract the
          # top entry (which previously caused v0.0.2 to ship with v1.0.0
          # release notes).
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "ERROR: No CHANGELOG.md section found for tag '$TAG'." >&2
            echo "Expected a heading like '## $TAG' or '## $TAG — title'." >&2
            exit 1
          fi

          echo "--- Extracted markdown for $TAG ---"
          cat RELEASE_NOTES.md

          # Convert markdown to HTML for the upload.
          # CurseForge's API accepts changelogType: markdown but renders it as
          # plain text (newlines collapse, ## and --- show as literal
          # characters). Wago accepts HTML and renders it correctly, so HTML
          # works for both platforms; GitHub Release notes also allow inline
          # HTML. BigWigs packager does NOT pandoc-convert for CF (its pandoc
          # branch is wowi-only), so the conversion has to happen here. One
          # conversion serves all four client packager steps below.
          if ! command -v pandoc &>/dev/null; then
            echo "pandoc not preinstalled — installing"
            sudo apt-get update -qq && sudo apt-get install -y pandoc
          fi
          pandoc --wrap=none -f commonmark -t html RELEASE_NOTES.md -o RELEASE_NOTES.html

          echo "--- Converted HTML uploaded to CurseForge / Wago ---"
          cat RELEASE_NOTES.html

      # Single packager run, no -g flag. Triage.toc carries a multi-flavor
      # "## Interface: 11508, 20505, 50503, 120005" line and .pkgmeta sets
      # enable-toc-creation, so one run builds ONE zip with per-flavor TOCs and
      # uploads it as a SINGLE CurseForge/Wago file tagged for all four clients
      # (Retail, Classic Era, TBC, Mists). This replaces the previous four -g
      # steps, which produced four separate CF downloads and confused users
      # expecting one package. See TRI-040.
      # Build the package WITHOUT uploading anywhere, purely so the shipped
      # zip can be inspected before any store sees it. Costs one extra
      # packager run; buys checking the real artifact, not a guess. (STU-064)
      - name: Build package (no upload) for release-safety checks
        if: steps.guard.outputs.publish == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      # A .pkgmeta ignore rule that strips a TOC-listed file ships an
      # "Error loading <file>" to every player at every login with no CI
      # signal — this check fails the release instead. Covers every flavor
      # TOC inside the zip. (STU-064)
      - name: Check — every TOC-listed file ships in the zip
        if: steps.guard.outputs.publish == 'true'
        run: node .github/scripts/check-toc-vs-zip.mjs .release

      - name: Package and Release
        if: steps.guard.outputs.publish == 'true'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # Verify CurseForge holds EXACTLY one file for this version — a silent
      # duplicate upload (packager retry layers make it structurally
      # possible) otherwise goes unnoticed until a player asks which file to
      # download. Warns-and-skips until CF_CORE_API_KEY (free Core API key,
      # console.curseforge.com) is added to repo secrets. (STU-064)
      - name: Check — CurseForge received exactly one file
        if: steps.guard.outputs.publish == 'true'
        env:
          CF_CORE_API_KEY: ${{ secrets.CF_CORE_API_KEY }}
          TAG: ${{ steps.guard.outputs.tag }}
        run: node .github/scripts/check-cf-upload.mjs

